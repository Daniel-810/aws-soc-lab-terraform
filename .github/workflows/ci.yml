name: CI

# NFR-08: a change has to pass automated checks before it can be merged.
# Nothing here needs AWS credentials. Every step reads the code only, so the
# workflow never assumes a role and cannot touch the account.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to a commit SHA rather than a tag. SR-25 requires external
# components to be fixed by version and integrity, and a tag is a moving
# pointer the upstream owner can repoint at any commit. The tag each SHA
# corresponds to is kept in the comment so the pin stays readable.
jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pulls the full history. Scanning only the latest commit
      # would miss a secret introduced earlier in the branch and removed in a
      # later commit, which still leaves it readable in the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # SR-10 / AC-09: no credentials, account identifiers or public addresses
      # in the repository. This repository is public, so a commit that reaches
      # main cannot be taken back: forks and caches keep it. The gate belongs
      # here rather than in review.
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          # The wrapper rewrites stdout, which hides the real exit code of the
          # commands below.
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      # Each module is validated on its own. Validating only envs/lab would
      # skip any module the root does not reference yet, and Terraform never
      # loads what it cannot reach from the root.
      #
      # -backend=false: modules hold no state, so no S3 backend is configured.
      # A provider schema is still required, which is why init runs first.
      - name: Validate modules
        run: |
          for dir in modules/*/ bootstrap/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      # envs/lab declares a backend whose bucket name is injected at init time
      # and is not in the repository (F16). Initialising without the backend
      # still resolves the module tree, which is what validate needs.
      - name: Validate lab environment
        run: |
          terraform -chdir=envs/lab init -backend=false -input=false
          terraform -chdir=envs/lab validate
