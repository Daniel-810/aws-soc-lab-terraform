name: CI

# NFR-08: a change has to pass automated checks before it can be merged.
# Nothing here needs AWS credentials. Every step reads the code only, so the
# workflow never assumes a role and cannot touch the account.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to a commit SHA rather than a tag. SR-25 requires external
# components to be fixed by version and integrity, and a tag is a moving
# pointer the upstream owner can repoint at any commit. The tag each SHA
# corresponds to is kept in the comment so the pin stays readable.
jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pulls the full history. Scanning only the latest commit
      # would miss a secret introduced earlier in the branch and removed in a
      # later commit, which still leaves it readable in the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # SR-10 / AC-09: no credentials, account identifiers or public addresses
      # in the repository. This repository is public, so a commit that reaches
      # main cannot be taken back: forks and caches keep it. The gate belongs
      # here rather than in review.
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          # The wrapper rewrites stdout, which hides the real exit code of the
          # commands below.
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      # Each module is validated on its own. Validating only envs/lab would
      # skip any module the root does not reference yet, and Terraform never
      # loads what it cannot reach from the root.
      #
      # -backend=false: modules hold no state, so no S3 backend is configured.
      # A provider schema is still required, which is why init runs first.
      - name: Validate modules
        run: |
          for dir in modules/*/ bootstrap/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      # Each environment declares a backend whose bucket name is injected at
      # init time and is not in the repository (F16). Initialising without the
      # backend still resolves the module tree, which is what validate needs.
      # Every directory under envs/ is covered, the persistent audit
      # environment included.
      - name: Validate environments
        run: |
          for dir in envs/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      # The modules' tests run against a mocked AWS provider, so they need no
      # credentials either. They pin decisions the code has to keep: routing
      # through the inspection layer, the boundary open to named sources only,
      # IMDSv2, encrypted volumes, forwarding on the inspection instance
      # (ADR-033). Modules were initialised in the validate step above.
      - name: Test modules
        run: |
          for dir in modules/*/; do
            if [ -d "$dir/tests" ]; then
              echo "::group::$dir"
              terraform -chdir="$dir" test
              echo "::endgroup::"
            fi
          done

  iac-scan:
    name: IaC security scan
    runs-on: ubuntu-latest
    env:
      # Pinned by version and by the SHA-256 of the release archive, published
      # in the release's checksums file. Downloading the binary directly keeps
      # a third-party action and its install script out of the pipeline.
      TRIVY_VERSION: "0.74.0"
      TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" trivy
          sudo install -m 755 trivy /usr/local/bin/trivy

      # HIGH and CRITICAL fail the build. Every finding the design accepts is
      # marked where the resource is defined, with the reason next to it
      # (#trivy:ignore), so a new resource of the same kind is still caught.
      - name: Scan with defaults (approach A)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL .

      # With the defaults the approach B module has count 0 and is skipped,
      # so it is scanned again with that approach selected.
      - name: Scan with approach B selected
        run: |
          echo 'firewall_mode = "oss"' > "$RUNNER_TEMP/oss.tfvars"
          echo 'route_through_firewall = true' >> "$RUNNER_TEMP/oss.tfvars"
          trivy config --exit-code 1 --severity HIGH,CRITICAL --tf-vars "$RUNNER_TEMP/oss.tfvars" envs/lab
